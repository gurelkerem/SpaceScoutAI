name: SpaceScout AI

on:

  workflow_dispatch:

  schedule:
    - cron: '0 5 * * *'

jobs:

  scout:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SpaceScout
        run: python main.py

      - name: Upload Website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: index.html
